<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Workbench · Catalog Engine</title><link rel="stylesheet" href="/imports/workbench.css"></head><body>
<header class="topbar"><a href="/studio" class="brand">CE <span>Catalog Studio</span></a><div class="doc-title"><strong id="docName">Cargando…</strong><small id="docMeta"></small></div><div class="actions"><button id="xrayBtn">Rayos X</button><button id="zoomOut">−</button><span id="zoomLabel">100 %</span><button id="zoomIn">+</button><button id="analyzeBtn" class="primary">Analizar</button></div></header>
<div class="workspace"><aside class="explorer"><div class="tabs"><button class="active">Productos</button><button id="statsTab">Resumen</button></div><div id="analysisStats" class="analysis-stats"></div><div id="productList" class="product-list"><p class="empty">El documento todavía no está analizado.</p></div></aside>
<main class="viewer"><div class="viewer-toolbar"><button id="prevPage">‹</button><span>Página <input id="pageInput" type="number" min="1" value="1"> de <b id="pageCount">—</b></span><button id="nextPage">›</button><span class="hint">PDF.js · producto y evidencias sincronizados</span></div><div id="pdfStage" class="pdf-stage"><div id="pageShell" class="page-shell"><canvas id="pdfCanvas"></canvas><div id="overlay" class="overlay"></div></div><div id="viewerMessage" class="viewer-message">Cargando PDF…</div></div></main>
<aside class="inspector"><div id="emptyInspector" class="empty-inspector"><b>Inspector</b><p>Selecciona un producto para revisar sus campos y evidencias.</p></div><div id="productInspector" hidden><div class="confidence"><span>Confianza del producto</span><strong id="productConfidence">—</strong></div><div id="fields"></div><section><h3>Características</h3><div id="features" class="chips"></div></section><section><h3>Precios</h3><div id="prices"></div></section><section><h3>¿Por qué?</h3><div id="evidenceList"></div></section><button id="approveBtn" class="approve">✓ Aprobar producto</button></div></aside></div>
<div id="toast" class="toast"></div><script type="module" src="/imports/workbench.js?v=0.40.3"></script></body></html>
